apiVersion: apps/v1
kind: Deployment
metadata:
  name: cgp-api
  labels:
    app: cgp-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cgp-api
  template:
    metadata:
      labels:
        app: cgp-api
    spec:
      containers:
      - name: cgp-api
        image: cloud-gitops-platform:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: cgp-config
              key: APP_ENV
